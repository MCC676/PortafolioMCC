<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mismo glifo que el logo del header (lucide "terminal"), al cian del sitio
       (#22d3ee) sobre el casi-negro del tema oscuro (#0a0a0a). Las coordenadas
       ya están escaladas desde el viewBox 24x24 de lucide para no depender de
       transform: el glifo va algo más grande que el original, porque a 16px el
       trazo fino se deshace.
       favicon.ico y apple-touch-icon.png se generan con esta misma geometría. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a" />
  <g
    fill="none"
    stroke="#22d3ee"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="12 44.5 27 29.5 12 14.5" />
    <line x1="32" y1="49.5" x2="52" y2="49.5" />
  </g>
</svg>
